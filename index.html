<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>101 • Interactive Physics Playground</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;700;900&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            user-select: none;
            -webkit-user-select: none;
            -webkit-touch-callout: none;
        }

        body {
            background-color: #030407;
            color: #ffffff;
            font-family: 'Outfit', sans-serif;
            width: 100vw;
            height: 100vh;
            overflow: hidden;
            position: relative;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            align-items: center;
        }

        /* Canvas de partículas de fondo para mayor profundidad */
        #bgCanvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
            pointer-events: none;
        }

        /* Capa de viñeta ambiental con gradientes profundos */
        .ambient-glow {
            position: absolute;
            inset: 0;
            background: radial-gradient(circle at 50% 40%, rgba(99, 102, 241, 0.08) 0%, rgba(168, 85, 247, 0.03) 40%, transparent 80%);
            z-index: 2;
            pointer-events: none;
        }

        /* Contenedor de los números interactivos (Zona de juego física) */
        #physicsPlayground {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 80%;
            z-index: 10;
            overflow: hidden;
        }

        /* Estilo de cada dígito interactivo flotante */
        .interactive-digit {
            position: absolute;
            font-weight: 900;
            font-size: 8rem;
            background: linear-gradient(135deg, #ffffff 20%, #c084fc 60%, #6366f1 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            cursor: grab;
            display: inline-block;
            line-height: 1;
            filter: drop-shadow(0 15px 35px rgba(108, 99, 255, 0.3));
            transition: filter 0.2s ease;
            touch-action: none;
            will-change: transform, left, top;
        }

        .interactive-digit:active {
            cursor: grabbing;
        }

        /* Panel inferior flotante para los 3 botones */
        .bottom-nav {
            position: relative;
            z-index: 20;
            width: 100%;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 12px;
            background: linear-gradient(to top, rgba(3, 4, 7, 0.95) 50%, transparent);
        }

        .action-btn {
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            color: #cbd5e1;
            padding: 12px 20px;
            border-radius: 16px;
            font-size: 0.85rem;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
            letter-spacing: 1px;
            text-transform: uppercase;
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.4);
            flex: 1;
            max-width: 130px;
            text-align: center;
        }

        .action-btn:hover {
            background: rgba(168, 85, 247, 0.2);
            border-color: rgba(168, 85, 247, 0.6);
            color: #ffffff;
            box-shadow: 0 0 25px rgba(168, 85, 247, 0.4);
            transform: translateY(-3px);
        }

        .action-btn:active {
            transform: translateY(0);
        }

        /* Ventana Modal */
        .modal-overlay {
            position: fixed;
            inset: 0;
            background: rgba(3, 4, 7, 0.85);
            backdrop-filter: blur(20px);
            z-index: 100;
            display: flex;
            justify-content: center;
            align-items: center;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s ease;
            padding: 20px;
        }

        .modal-overlay.active {
            opacity: 1;
            pointer-events: auto;
        }

        .modal-content {
            background: rgba(18, 20, 28, 0.9);
            border: 1px solid rgba(255, 255, 255, 0.12);
            padding: 30px;
            border-radius: 24px;
            width: 100%;
            max-width: 400px;
            text-align: center;
            box-shadow: 0 25px 60px rgba(0, 0, 0, 0.7);
            transform: scale(0.9);
            transition: transform 0.3s cubic-bezier(0.16, 1, 0.3, 1);
        }

        .modal-overlay.active .modal-content {
            transform: scale(1);
        }

        .modal-title {
            font-size: 1.5rem;
            font-weight: 900;
            margin-bottom: 12px;
            background: linear-gradient(135deg, #c084fc, #6366f1);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .modal-body {
            color: #94a3b8;
            font-size: 0.95rem;
            line-height: 1.6;
            margin-bottom: 24px;
        }

        .close-modal {
            background: #a855f7;
            color: white;
            border: none;
            padding: 10px 24px;
            border-radius: 12px;
            font-weight: 700;
            cursor: pointer;
            width: 100%;
            transition: background 0.2s;
        }

        .close-modal:hover {
            background: #9333ea;
        }

        /* Ajustes específicos para móviles en vertical */
        @media (max-width: 768px) {
            .interactive-digit {
                font-size: 6rem;
            }
            .action-btn {
                padding: 10px 12px;
                font-size: 0.75rem;
                letter-spacing: 0.5px;
            }
        }
    </style>
</head>
<body>

    <canvas id="bgCanvas"></canvas>
    <div class="ambient-glow"></div>

    <!-- Zona interactiva donde flotan y se arrastran los números -->
    <div id="physicsPlayground"></div>

    <!-- Panel de 3 botones inferiores -->
    <div class="bottom-nav">
        <button class="action-btn" onclick="openModal(1)">Reiniciar</button>
        <button class="action-btn" onclick="openModal(2)">Efectos</button>
        <button class="action-btn" onclick="openModal(3)">Info</button>
    </div>

    <!-- Modal Dinámico -->
    <div class="modal-overlay" id="modalOverlay" onclick="closeModal()">
        <div class="modal-content" onclick="event.stopPropagation()">
            <h2 class="modal-title" id="modalTitle">Título</h2>
            <p class="modal-body" id="modalText">Texto...</p>
            <button class="close-modal" onclick="closeModal()">Entendido</button>
        </div>
    </div>

    <script>
        // --- 1. SINTETIZADOR DE AUDIO (Web Audio API) ---
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();

        function playSound(type) {
            if (audioCtx.state === 'suspended') audioCtx.resume();
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            const now = audioCtx.currentTime;

            if (type === 'pop') {
                osc.type = 'sine';
                osc.frequency.setValueAtTime(200, now);
                osc.frequency.exponentialRampToValueAtTime(600, now + 0.15);
                gain.gain.setValueAtTime(0.15, now);
                gain.gain.exponentialRampToValueAtTime(0.001, now + 0.15);
                osc.start(now); osc.stop(now + 0.15);
            } else if (type === 'explode') {
                osc.type = 'triangle';
                osc.frequency.setValueAtTime(150, now);
                osc.frequency.exponentialRampToValueAtTime(40, now + 0.3);
                gain.gain.setValueAtTime(0.25, now);
                gain.gain.exponentialRampToValueAtTime(0.001, now + 0.3);
                osc.start(now); osc.stop(now + 0.3);
            }
        }

        // --- 2. FONDO DE PARTÍCULAS DE PROFUNDIDAD ---
        const canvas = document.getElementById('bgCanvas');
        const ctx = canvas.getContext('2d');
        let particles = [];

        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();

        for (let i = 0; i < 50; i++) {
            particles.push({
                x: Math.random() * canvas.width,
                y: Math.random() * canvas.height,
                size: Math.random() * 2,
                speedY: (Math.random() - 0.5) * 0.3,
                alpha: Math.random() * 0.5 + 0.2
            });
        }

        function animateBg() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            particles.forEach(p => {
                p.y += p.speedY;
                if (p.y < 0) p.y = canvas.height;
                if (p.y > canvas.height) p.y = 0;
                ctx.fillStyle = `rgba(255, 255, 255, ${p.alpha})`;
                ctx.beginPath();
                ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
                ctx.fill();
            });
            requestAnimationFrame(animateBg);
        }
        animateBg();

        // --- 3. SISTEMA INTERACTIVO DE NÚMEROS (Arrastrar, Inflar y Explotar) ---
        const playground = document.getElementById('physicsPlayground');

        function spawnNumber(val, x, y) {
            const el = document.createElement('div');
            el.className = 'interactive-digit';
            el.innerText = val;
            
            // Posición inicial centrada o en coordenadas específicas
            const pWidth = playground.clientWidth;
            const pHeight = playground.clientHeight;
            
            let posX = x !== undefined ? x : pWidth / 2 + (Math.random() * 100 - 50);
            let posY = y !== undefined ? y : pHeight / 2 + (Math.random() * 100 - 50);

            el.style.left = `${posX}px`;
            el.style.top = `${posY}px`;

            let scale = 1;
            let isHolding = false;
            let holdTimer = null;
            let startX, startY;

            // Funciones de control táctil y ratón
            function startDrag(e) {
                isHolding = true;
                const clientX = e.clientX || e.touches[0].clientX;
                const clientY = e.clientY || e.touches[0].clientY;
                startX = clientX - el.offsetLeft;
                startY = clientY - el.offsetTop;

                // Iniciar temporizador de hinchado tipo globo
                holdTimer = setInterval(() => {
                    if (isHolding) {
                        scale += 0.05;
                        if (scale > 2.5) { // ¡Explosión por tamaño máximo!
                            clearInterval(holdTimer);
                            explodeNumber(el, scale);
                        } else {
                            el.style.transform = `scale(${scale})`;
                            playSound('pop');
                        }
                    }
                }, 100);

                e.preventDefault();
            }

            function onDrag(e) {
                if (!isHolding) return;
                const clientX = e.clientX || e.touches[0].clientX;
                const clientY = e.clientY || e.touches[0].clientY;
                
                el.style.left = `${clientX - startX}px`;
                el.style.top = `${clientY - startY}px`;
            }

            function stopDrag() {
                if (isHolding) {
                    isHolding = false;
                    clearInterval(holdTimer);
                    // Si lo suelta antes de explotar, vuelve a su escala normal con rebote
                    if (scale < 2.5) {
                        scale = 1;
                        el.style.transform = `scale(1)`;
                    }
                }
            }

            el.addEventListener('mousedown', startDrag);
            window.addEventListener('mousemove', onDrag);
            window.addEventListener('mouseup', stopDrag);

            el.addEventListener('touchstart', startDrag);
            window.addEventListener('touchmove', onDrag);
            window.addEventListener('touchend', stopDrag);

            playground.appendChild(el);
        }

        function explodeNumber(el, currentScale) {
            playSound('explode');
            const rect = el.getBoundingClientRect();
            const centerX = rect.left + rect.width / 2;
            const centerY = rect.top + rect.height / 2;

            // Eliminar número actual
            el.remove();

            // Crear partículas de explosión visual
            for (let i = 0; i < 20; i++) {
                const particle = document.createElement('div');
                particle.style.position = 'absolute';
                particle.style.left = `${centerX}px`;
                particle.style.top = `${centerY}px`;
                particle.style.width = '6px';
                particle.style.height = '6px';
                particle.style.backgroundColor = Math.random() > 0.5 ? '#a855f7' : '#6366f1';
                particle.style.borderRadius = '50%';
                particle.style.zIndex = '15';
                playground.appendChild(particle);

                const angle = Math.random() * Math.PI * 2;
                const speed = Math.random() * 80 + 20;
                const destX = Math.cos(angle) * speed;
                const destY = Math.sin(angle) * speed;

                particle.animate([
                    { transform: 'translate(0, 0) scale(1)', opacity: 1 },
                    { transform: `translate(${destX}px, ${destY}px) scale(0)`, opacity: 0 }
                ], {
                    duration: 500,
                    easing: 'cubic-bezier(0, .9, .57, 1)'
                }).onfinish = () => particle.remove();
            }

            // Nacimiento de un nuevo número muy pequeño tras la explosión
            setTimeout(() => {
                const randomVal = Math.random() > 0.5 ? '1' : '0';
                spawnNumber(randomVal, centerX - 30, centerY - 40);
            }, 300);
        }

        // Inicializar el "101" al cargar la página distribuidos en pantalla
        window.addEventListener('load', () => {
            const w = window.innerWidth;
            const h = window.innerHeight * 0.7;
            spawnNumber('1', w * 0.25, h * 0.4);
            spawnNumber('0', w * 0.45, h * 0.4);
            spawnNumber('1', w * 0.65, h * 0.4);
        });

        // --- 4. GESTIÓN DE MODALES DE LOS 3 BOTONES ---
        const modalOverlay = document.getElementById('modalOverlay');
        const modalTitle = document.getElementById('modalTitle');
        const modalText = document.getElementById('modalText');

        const modalData = {
            1: {
                title: "Reiniciar Entorno",
                text: "Limpia la pantalla y restablece los números originales 101 a su posición central."
            },
            2: {
                title: "Modo Físicas y Globos",
                text: "Mantén presionado cualquier número para inflarlo como un globo hasta que explote en fragmentos y nazca uno nuevo."
            },
            3: {
                title: "Sobre el Proyecto",
                text: "Diseño optimizado para smartphones en vertical con animaciones fluidas por hardware y audio sintetizado nativo."
            }
        };

        function openModal(id) {
            if (id === 1) {
                // Acción de reiniciar
                playground.innerHTML = '';
                const w = window.innerWidth;
                const h = window.innerHeight * 0.7;
                spawnNumber('1', w * 0.25, h * 0.4);
                spawnNumber('0', w * 0.45, h * 0.4);
                spawnNumber('1', w * 0.65, h * 0.4);
                return;
            }
            modalTitle.innerText = modalData[id].title;
            modalText.innerText = modalData[id].text;
            modalOverlay.classList.add('active');
        }

        function closeModal() {
            modalOverlay.classList.remove('active');
        }
    </script>
</body>
</html>
