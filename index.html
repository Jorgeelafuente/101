<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>101 • Experiencia Inmersiva</title>
    <!-- Importamos fuentes modernas de Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;600;900&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            user-select: none;
        }

        body {
            background-color: #060709;
            color: #ffffff;
            font-family: 'Outfit', sans-serif;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            position: relative;
        }

        /* Canvas de partículas dinámicas de fondo */
        #bgCanvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
            pointer-events: none;
        }

        /* Viñeta de iluminación ambiental */
        .ambient-glow {
            position: absolute;
            width: 600px;
            height: 600px;
            background: radial-gradient(circle, rgba(99, 102, 241, 0.15) 0%, rgba(168, 85, 247, 0.05) 50%, transparent 70%);
            z-index: 2;
            pointer-events: none;
            transition: transform 0.5s ease-out;
        }

        /* Contenedor principal de la interfaz */
        .main-container {
            position: relative;
            z-index: 10;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 60px;
        }

        /* Grupo de números con perspectiva 3D */
        .number-group {
            display: flex;
            gap: 30px;
            align-items: center;
            justify-content: center;
            perspective: 1200px;
        }

        /* Contenedor individual de cada dígito y su botón */
        .digit-column {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 24px;
            transition: transform 0.3s cubic-bezier(0.25, 1, 0.5, 1);
        }

        /* Estilo profesional de los números 1, 0, 1 */
        .digit {
            font-size: 13rem;
            font-weight: 900;
            background: linear-gradient(135deg, #ffffff 20%, #a855f7 60%, #6366f1 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            cursor: pointer;
            line-height: 1;
            transition: filter 0.3s ease;
            filter: drop-shadow(0 10px 30px rgba(108, 99, 255, 0.25));
            transform-style: preserve-3d;
        }

        .digit:hover {
            filter: drop-shadow(0 0 45px rgba(168, 85, 247, 0.7));
        }

        /* Botones minimalistas de vidrio esmerilado (Glassmorphism) */
        .action-btn {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.12);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            color: #94a3b8;
            padding: 14px 28px;
            border-radius: 14px;
            font-size: 0.95rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.4s cubic-bezier(0.16, 1, 0.3, 1);
            letter-spacing: 1.5px;
            text-transform: uppercase;
        }

        .action-btn:hover {
            background: rgba(168, 85, 247, 0.15);
            border-color: rgba(168, 85, 247, 0.5);
            color: #ffffff;
            box-shadow: 0 0 25px rgba(168, 85, 247, 0.3);
            transform: translateY(-4px);
        }

        .action-btn:active {
            transform: translateY(-1px);
        }

        /* Ventana Modal Interactiva para los botones */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(6, 7, 9, 0.8);
            backdrop-filter: blur(16px);
            z-index: 100;
            display: flex;
            justify-content: center;
            align-items: center;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.4s ease;
        }

        .modal-overlay.active {
            opacity: 1;
            pointer-events: auto;
        }

        .modal-content {
            background: rgba(18, 20, 26, 0.85);
            border: 1px solid rgba(255, 255, 255, 0.1);
            padding: 40px;
            border-radius: 24px;
            width: 90%;
            max-width: 500px;
            text-align: center;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.5);
            transform: scale(0.9);
            transition: transform 0.4s cubic-bezier(0.16, 1, 0.3, 1);
        }

        .modal-overlay.active .modal-content {
            transform: scale(1);
        }

        .modal-title {
            font-size: 1.8rem;
            font-weight: 900;
            margin-bottom: 15px;
            background: linear-gradient(135deg, #a855f7, #6366f1);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .modal-body {
            color: #cbd5e1;
            font-size: 1.05rem;
            line-height: 1.6;
            margin-bottom: 30px;
        }

        .close-modal {
            background: #a855f7;
            color: white;
            border: none;
            padding: 12px 30px;
            border-radius: 12px;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.3s ease;
        }

        .close-modal:hover {
            background: #9333ea;
        }
    </style>
</head>
<body>

    <!-- Fondo dinámico interactivo -->
    <canvas id="bgCanvas"></canvas>
    <div class="ambient-glow" id="ambientGlow"></div>

    <!-- Contenedor Principal -->
    <div class="main-container">
        <div class="number-group">
            
            <!-- Dígito 1 -->
            <div class="digit-column" id="col1">
                <div class="digit" data-value="1">1</div>
                <button class="action-btn" onclick="openModal(1)">Explorar</button>
            </div>

            <!-- Dígito 0 -->
            <div class="digit-column" id="col2">
                <div class="digit" data-value="0">0</div>
                <button class="action-btn" onclick="openModal(2)">Sistemas</button>
            </div>

            <!-- Dígito 1 -->
            <div class="digit-column" id="col3">
                <div class="digit" data-value="1">1</div>
                <button class="action-btn" onclick="openModal(3)">Cinemática</button>
            </div>

        </div>
    </div>

    <!-- Ventana Modal Dinámica -->
    <div class="modal-overlay" id="modalOverlay" onclick="closeModal()">
        <div class="modal-content" onclick="event.stopPropagation()">
            <h2 class="modal-title" id="modalTitle">Título</h2>
            <p class="modal-body" id="modalText">Contenido de la sección...</p>
            <button class="close-modal" onclick="closeModal()">Cerrar</button>
        </div>
    </div>

    <script>
        // --- 1. SINTETIZADOR DE AUDIO PROFESIONAL (Web Audio API) ---
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();

        function playSound(type) {
            if (audioCtx.state === 'suspended') {
                audioCtx.resume();
            }
            const osc = audioCtx.createOscillator();
            const gainNode = audioCtx.createGain();
            osc.connect(gainNode);
            gainNode.connect(audioCtx.destination);

            const now = audioCtx.currentTime;

            if (type === 'hover') {
                osc.type = 'sine';
                osc.frequency.setValueAtTime(440, now);
                osc.frequency.exponentialRampToValueAtTime(880, now + 0.08);
                gainNode.gain.setValueAtTime(0.03, now);
                gainNode.gain.exponentialRampToValueAtTime(0.001, now + 0.08);
                osc.start(now);
                osc.stop(now + 0.08);
            } else if (type === 'click') {
                osc.type = 'triangle';
                osc.frequency.setValueAtTime(220, now);
                osc.frequency.exponentialRampToValueAtTime(110, now + 0.2);
                gainNode.gain.setValueAtTime(0.1, now);
                gainNode.gain.exponentialRampToValueAtTime(0.001, now + 0.2);
                osc.start(now);
                osc.stop(now + 0.2);
            }
        }

        // --- 2. MOTOR DE PARTÍCULAS DE FONDO ---
        const canvas = document.getElementById('bgCanvas');
        const ctx = canvas.getContext('2d');
        let particles = [];

        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();

        class Star {
            constructor() {
                this.x = Math.random() * canvas.width;
                this.y = Math.random() * canvas.height;
                this.size = Math.random() * 1.5;
                this.speedY = (Math.random() - 0.5) * 0.2;
                this.speedX = (Math.random() - 0.5) * 0.2;
                this.alpha = Math.random() * 0.7 + 0.3;
            }
            update() {
                this.x += this.speedX;
                this.y += this.speedY;
                if (this.x < 0) this.x = canvas.width;
                if (this.x > canvas.width) this.x = 0;
                if (this.y < 0) this.y = canvas.height;
                if (this.y > canvas.height) this.y = 0;
            }
            draw() {
                ctx.fillStyle = `rgba(255, 255, 255, ${this.alpha})`;
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
                ctx.fill();
            }
        }

        for (let i = 0; i < 80; i++) particles.push(new Star());

        function animateStars() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            particles.forEach(p => { p.update(); p.draw(); });
            requestAnimationFrame(animateStars);
        }
        animateStars();

        // --- 3. EFECTOS 3D DE RATÓN Y LUZ AMBIENTAL ---
        const ambientGlow = document.getElementById('ambientGlow');
        const digits = document.querySelectorAll('.digit');

        window.addEventListener('mousemove', (e) => {
            const x = e.clientX;
            const y = e.clientY;

            // Mover la luz ambiental suavemente siguiendo el cursor
            ambientGlow.style.transform = `translate(${x - 300}px, ${y - 300}px)`;

            // Efecto de inclinación 3D en los números
            const centerX = window.innerWidth / 2;
            const centerY = window.innerHeight / 2;
            const rotateX = (y - centerY) / 25;
            const rotateY = (centerX - x) / 25;

            digits.forEach((digit, index) => {
                const depth = (index + 1) * 5;
                digit.style.transform = `rotateX(${-rotateX}deg) rotateY(${rotateY}deg) translateZ(${depth}px)`;
            });
        });

        // Eventos interactivos en los dígitos
        digits.forEach(digit => {
            digit.addEventListener('mouseenter', () => playSound('hover'));
            digit.addEventListener('click', (e) => {
                playSound('click');
                // Efecto visual dinámico al hacer clic en el número
                digit.style.transform += ' scale(1.15)';
                setTimeout(() => {
                    digit.style.transform = digit.style.transform.replace(' scale(1.15)', '');
                }, 200);
            });
        });

        // --- 4. GESTIÓN DE LOS BOTONES Y MODALES ---
        const modalOverlay = document.getElementById('modalOverlay');
        const modalTitle = document.getElementById('modalTitle');
        const modalText = document.getElementById('modalText');

        const modalData = {
            1: {
                title: "Exploración Interactiva",
                text: "Has accedido al primer nodo del sistema 101. Este espacio está diseñado con físicas fluidas, iluminación reactiva y micro-interacciones de alta gama."
            },
            2: {
                title: "Núcleo de Sistemas",
                text: "El motor gráfico y de audio opera en tiempo real directamente en tu navegador mediante WebGL y Web Audio API, garantizando fluidez absoluta sin tiempos de carga."
            },
            3: {
                title: "Secuencia Cinemática",
                text: "Próximamente podrás activar secuencias de inmersión visual completas con transiciones dinámicas de cámara y efectos de post-procesado."
            }
        };

        function openModal(id) {
            playSound('click');
            modalTitle.innerText = modalData[id].title;
            modalText.innerText = modalData[id].text;
            modalOverlay.classList.add('active');
        }

        function closeModal() {
            playSound('click');
            modalOverlay.classList.remove('active');
        }
    </style>
</body>
</html>
