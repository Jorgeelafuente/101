<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>101 • Interactive Experience</title>
    <link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=Outfit:wght@400;700;900&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            user-select: none;
            -webkit-user-select: none;
        }

        body, html {
            width: 100%;
            height: 100%;
            background-color: #000000;
            color: #00ff66;
            font-family: 'Share Tech Mono', monospace;
            overflow-x: hidden;
        }

        /* Altura de scroll para controlar la cinemática */
        body {
            height: 500vh;
        }

        /* Contenedor fijo de la cinemática */
        .cinema-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: #000300;
            z-index: 10;
            overflow: hidden;
        }

        #cyberCanvas {
            width: 100%;
            height: 100%;
            display: block;
        }

        /* Indicador de desplazamiento */
        .scroll-hint {
            position: absolute;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            color: #00ff66;
            font-size: 0.9rem;
            letter-spacing: 2px;
            text-transform: uppercase;
            z-index: 20;
            pointer-events: none;
            animation: pulseHint 2s infinite ease-in-out;
            text-align: center;
            background: rgba(0, 20, 5, 0.7);
            padding: 10px 20px;
            border-radius: 4px;
            border: 1px solid rgba(0, 255, 102, 0.3);
            box-shadow: 0 0 15px rgba(0, 255, 102, 0.2);
        }

        @keyframes pulseHint {
            0%, 100% { opacity: 0.4; transform: translate(-50%, 0); }
            50% { opacity: 1; transform: translate(-50%, -6px); }
        }

        /* Etapa Final: El Botón 101 */
        .final-stage {
            position: absolute;
            inset: 0;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            background: rgba(0, 5, 2, 0.85);
            backdrop-filter: blur(15px);
            z-index: 30;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.8s ease;
        }

        .final-stage.active {
            opacity: 1;
            pointer-events: auto;
        }

        .btn-101 {
            font-size: 10rem;
            font-weight: 900;
            font-family: 'Outfit', sans-serif;
            background: linear-gradient(135deg, #ffffff 20%, #00ff66 60%, #008f39 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            cursor: pointer;
            filter: drop-shadow(0 0 40px rgba(0, 255, 102, 0.6));
            transition: transform 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275), filter 0.3s ease;
            line-height: 1;
            margin-bottom: 15px;
        }

        .btn-101:hover {
            transform: scale(1.12) rotate(2deg);
            filter: drop-shadow(0 0 65px rgba(0, 255, 102, 0.9));
        }

        .btn-subtitle {
            color: #8affb0;
            font-size: 1rem;
            letter-spacing: 3px;
            text-transform: uppercase;
            font-weight: 700;
        }

        /* Segunda pestaña / Mini pestaña flotante con los 3 botones */
        .sub-page {
            position: fixed;
            inset: 0;
            background: rgba(2, 5, 3, 0.95);
            backdrop-filter: blur(20px);
            z-index: 100;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 30px;
            text-align: center;
            transform: translateY(100%);
            transition: transform 0.6s cubic-bezier(0.16, 1, 0.3, 1);
            border-top: 2px solid #00ff66;
            box-shadow: 0 -10px 40px rgba(0, 255, 102, 0.2);
        }

        .sub-page.open {
            transform: translateY(0);
        }

        .sub-title {
            font-size: 2.5rem;
            font-weight: 900;
            font-family: 'Outfit', sans-serif;
            margin-bottom: 15px;
            background: linear-gradient(135deg, #00ff66, #ffffff);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .sub-text {
            color: #a3e6c9;
            font-size: 1.1rem;
            max-width: 550px;
            line-height: 1.6;
            margin-bottom: 35px;
        }

        /* Contenedor de los 3 botones principales: Horarios, Hogar y Juegos */
        .action-buttons-group {
            display: flex;
            gap: 15px;
            flex-wrap: wrap;
            justify-content: center;
            margin-bottom: 30px;
            max-width: 600px;
            width: 100%;
        }

        .action-btn {
            background: rgba(0, 255, 102, 0.05);
            border: 1px solid rgba(0, 255, 102, 0.3);
            color: #00ff66;
            padding: 16px 28px;
            border-radius: 12px;
            font-weight: 700;
            font-family: 'Share Tech Mono', monospace;
            cursor: pointer;
            letter-spacing: 1.5px;
            text-transform: uppercase;
            transition: all 0.3s ease;
            font-size: 1.1rem;
            flex: 1;
            min-width: 140px;
        }

        .action-btn:hover {
            background: rgba(0, 255, 102, 0.2);
            border-color: #00ff66;
            box-shadow: 0 0 25px rgba(0, 255, 102, 0.5);
            transform: translateY(-3px);
            color: #ffffff;
        }

        .action-btn:active {
            transform: translateY(0);
        }

        .back-btn {
            background: transparent;
            border: 1px solid rgba(255, 255, 255, 0.2);
            color: #8affb0;
            padding: 10px 20px;
            border-radius: 8px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s ease;
            font-family: 'Share Tech Mono', monospace;
            margin-top: 10px;
        }

        .back-btn:hover {
            color: #fff;
            border-color: #fff;
            background: rgba(255, 255, 255, 0.05);
        }

        /* Modal emergente para cuando pulsas cualquiera de los 3 botones */
        .detail-modal {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.8);
            backdrop-filter: blur(10px);
            z-index: 150;
            display: flex;
            justify-content: center;
            align-items: center;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s ease;
            padding: 20px;
        }

        .detail-modal.active {
            opacity: 1;
            pointer-events: auto;
        }

        .detail-content {
            background: #020b05;
            border: 1px solid #00ff66;
            box-shadow: 0 0 30px rgba(0, 255, 102, 0.3);
            border-radius: 16px;
            padding: 30px;
            max-width: 450px;
            width: 100%;
            text-align: center;
        }

        .detail-title {
            font-size: 1.8rem;
            color: #00ff66;
            margin-bottom: 15px;
            font-family: 'Outfit', sans-serif;
            font-weight: 900;
        }

        .detail-text {
            color: #cbd5e1;
            font-size: 1rem;
            line-height: 1.6;
            margin-bottom: 25px;
        }

        .close-detail-btn {
            background: #00ff66;
            color: #000;
            border: none;
            padding: 10px 24px;
            border-radius: 8px;
            font-weight: 700;
            cursor: pointer;
            font-family: 'Share Tech Mono', monospace;
        }

        .close-detail-btn:hover {
            background: #8affb0;
        }
    </style>
</head>
<body>

    <!-- Contenedor Cinemático por Scroll -->
    <div class="cinema-container">
        <canvas id="cyberCanvas"></canvas>
        <div class="scroll-hint" id="scrollHint">↓ Desliza para avanzar ↓</div>

        <!-- Etapa Final: El Botón 101 -->
        <div class="final-stage" id="finalStage">
            <div class="btn-101" onclick="openSubPage()">101</div>
            <div class="btn-subtitle">Núcleo activado • Pulsa para entrar</div>
        </div>
    </div>

    <!-- Pestaña Emergente al pulsar el 101 -->
    <div class="sub-page" id="subPage">
        <h1 class="sub-title">Menú Principal 101</h1>
        <p class="sub-text">Selecciona una de las opciones para acceder a la sección correspondiente:</p>
        
        <!-- Los 3 Botones Solicitados -->
        <div class="action-buttons-group">
            <button class="action-btn" onclick="openDetail('horarios')">Horarios</button>
            <button class="action-btn" onclick="openDetail('hogar')">Hogar</button>
            <button class="action-btn" onclick="openDetail('juegos')">Juegos</button>
        </div>

        <button class="back-btn" onclick="closeSubPage()">Volver a la Cinematográfica</button>
    </div>

    <!-- Modal de detalle al pulsar Horarios, Hogar o Juegos -->
    <div class="detail-modal" id="detailModal">
        <div class="detail-content">
            <h2 class="detail-title" id="detailTitle">Título</h2>
            <p class="detail-text" id="detailText">Descripción de la sección seleccionada...</p>
            <button class="close-detail-btn" onclick="closeDetail()">Cerrar</button>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('cyberCanvas');
        const ctx = canvas.getContext('2d');
        const scrollHint = document.getElementById('scrollHint');
        const finalStage = document.getElementById('finalStage');
        const subPage = document.getElementById('subPage');

        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();

        let scrollProgress = 0;

        const characters = "01010101019876543210ABCDEF";
        const fontSize = 18;
        const columns = Math.floor(canvas.width / fontSize);
        const drops = [];

        for (let i = 0; i < columns; i++) {
            drops[i] = Math.floor(Math.random() * canvas.height);
        }

        window.addEventListener('scroll', () => {
            const scrollTop = window.scrollY;
            const maxScroll = document.documentElement.scrollHeight - window.innerHeight;
            scrollProgress = Math.max(0, Math.min(1, scrollTop / maxScroll));

            if (scrollTop > 40) {
                scrollHint.style.opacity = '0';
            } else {
                scrollHint.style.opacity = '1';
            }

            if (scrollProgress > 0.92) {
                finalStage.classList.add('active');
            } else {
                finalStage.classList.remove('active');
            }
        });

        function renderCyberCinematic() {
            ctx.fillStyle = 'rgba(0, 5, 2, 0.15)';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            ctx.fillStyle = '#00ff66';
            ctx.font = fontSize + 'px "Share Tech Mono", monospace';

            for (let i = 0; i < drops.length; i++) {
                const text = characters.charAt(Math.floor(Math.random() * characters.length));
                const x = i * fontSize;
                const y = drops[i] * fontSize;

                ctx.fillStyle = Math.random() > 0.85 ? '#ffffff' : '#00ff66';
                ctx.fillText(text, x, y);

                if (y > canvas.height && Math.random() > 0.975) {
                    drops[i] = 0;
                }
                drops[i] += 1 + (scrollProgress * 5);
            }

            const centerX = canvas.width / 2;
            const centerY = canvas.height / 2;
            const coreRadius = 50 + (scrollProgress * 300);

            ctx.save();
            ctx.strokeStyle = scrollProgress > 0.7 ? '#ffffff' : '#00ff66';
            ctx.lineWidth = 2 + (scrollProgress * 4);
            ctx.shadowColor = '#00ff66';
            ctx.shadowBlur = 20;
            ctx.beginPath();
            ctx.arc(centerX, centerY, coreRadius, 0, Math.PI * 2);
            ctx.stroke();
            ctx.restore();

            if (scrollProgress >= 0.85) {
                const explosionProgress = (scrollProgress - 0.85) / 0.15;
                const flashRadius = explosionProgress * Math.max(canvas.width, canvas.height);

                ctx.save();
                const grad = ctx.createRadialGradient(centerX, centerY, 10, centerX, centerY, flashRadius);
                grad.addColorStop(0, 'rgba(255, 255, 255, 1)');
                grad.addColorStop(0.3, 'rgba(0, 255, 102, 0.8)');
                grad.addColorStop(1, 'rgba(0, 0, 0, 0)');
                
                ctx.fillStyle = grad;
                ctx.beginPath();
                ctx.arc(centerX, centerY, flashRadius, 0, Math.PI * 2);
                ctx.fill();
                ctx.restore();
            }

            requestAnimationFrame(renderCyberCinematic);
        }
        renderCyberCinematic();

        // Control de navegación de la pestaña del 101
        function openSubPage() {
            subPage.classList.add('open');
        }

        function closeSubPage() {
            subPage.classList.remove('open');
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        // Lógica de los 3 botones: Horarios, Hogar y Juegos
        const detailModal = document.getElementById('detailModal');
        const detailTitle = document.getElementById('detailTitle');
        const detailText = document.getElementById('detailText');

        const sectionData = {
            horarios: {
                title: "📅 Horarios",
                text: "Sección de Horarios. Aquí puedes consultar y gestionar los turnos, calendarios y la planificación del sistema."
            },
            hogar: {
                title: "🏠 Hogar",
                text: "Sección de Hogar. Panel de control domótico y dispositivos integrados del hogar inteligente."
            },
            juegos: {
                title: "🎮 Juegos",
                text: "Sección de Juegos. Acceso al área de entretenimiento, mini-juegos interactivos y rankings."
            }
        };

        function openDetail(key) {
            detailTitle.innerText = sectionData[key].title;
            detailText.innerText = sectionData[key].text;
            detailModal.classList.add('active');
        }

        function closeDetail() {
            detailModal.classList.remove('active');
        }
    </script>
</body>
</html>
