<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>101 • Shingeki no Kyojin Cinematic Experience</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;700;900&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            user-select: none;
            -webkit-user-select: none;
        }

        body, html {
            width: 100%;
            height: 100%;
            background-color: #030407;
            color: #ffffff;
            font-family: 'Outfit', sans-serif;
            overflow-x: hidden;
        }

        /* Altura de scroll generosa para controlar la cinemática milimétricamente */
        body {
            height: 500vh;
        }

        /* Contenedor fijo de la cinemática generada por código */
        .cinema-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: #030407;
            z-index: 10;
            overflow: hidden;
        }

        #cinematicCanvas {
            width: 100%;
            height: 100%;
            display: block;
        }

        /* Indicador inicial de desplazamiento */
        .scroll-hint {
            position: absolute;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            color: rgba(255, 255, 255, 0.6);
            font-size: 0.85rem;
            letter-spacing: 2px;
            text-transform: uppercase;
            z-index: 20;
            pointer-events: none;
            animation: pulseHint 2s infinite ease-in-out;
            text-align: center;
            background: rgba(0, 0, 0, 0.4);
            padding: 8px 16px;
            border-radius: 20px;
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        @keyframes pulseHint {
            0%, 100% { opacity: 0.4; transform: translate(-50%, 0); }
            50% { opacity: 1; transform: translate(-50%, -6px); }
        }

        /* Etapa Final: El Botón 101 que emerge de la explosión */
        .final-stage {
            position: absolute;
            inset: 0;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            background: rgba(3, 4, 7, 0.8);
            backdrop-filter: blur(15px);
            z-index: 30;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.8s ease;
        }

        .final-stage.active {
            opacity: 1;
            pointer-events: auto;
        }

        .btn-101 {
            font-size: 10rem;
            font-weight: 900;
            background: linear-gradient(135deg, #ffffff 20%, #ef4444 60%, #a855f7 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            cursor: pointer;
            filter: drop-shadow(0 0 40px rgba(239, 68, 68, 0.5));
            transition: transform 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275), filter 0.3s ease;
            line-height: 1;
            margin-bottom: 15px;
        }

        .btn-101:hover {
            transform: scale(1.12) rotate(2deg);
            filter: drop-shadow(0 0 60px rgba(239, 68, 68, 0.9));
        }

        .btn-subtitle {
            color: #94a3b8;
            font-size: 1rem;
            letter-spacing: 3px;
            text-transform: uppercase;
            font-weight: 700;
        }

        /* Segunda pestaña / Vista interna */
        .sub-page {
            position: fixed;
            inset: 0;
            background: #060709;
            z-index: 100;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 30px;
            text-align: center;
            transform: translateY(100%);
            transition: transform 0.6s cubic-bezier(0.16, 1, 0.3, 1);
        }

        .sub-page.open {
            transform: translateY(0);
        }

        .sub-title {
            font-size: 2.5rem;
            font-weight: 900;
            margin-bottom: 15px;
            background: linear-gradient(135deg, #ef4444, #a855f7);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .sub-text {
            color: #cbd5e1;
            font-size: 1.05rem;
            max-width: 550px;
            line-height: 1.6;
            margin-bottom: 35px;
        }

        /* Contenedor de los 3 botones finales */
        .action-buttons-group {
            display: flex;
            gap: 15px;
            flex-wrap: wrap;
            justify-content: center;
            margin-bottom: 30px;
            max-width: 600px;
        }

        .action-btn {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.15);
            color: white;
            padding: 12px 24px;
            border-radius: 12px;
            font-weight: 700;
            cursor: pointer;
            letter-spacing: 1px;
            text-transform: uppercase;
            transition: all 0.3s ease;
            font-size: 0.9rem;
        }

        .action-btn:hover {
            background: rgba(239, 68, 68, 0.2);
            border-color: #ef4444;
            box-shadow: 0 0 20px rgba(239, 68, 68, 0.4);
            transform: translateY(-2px);
        }

        .back-btn {
            background: transparent;
            border: 1px solid rgba(255, 255, 255, 0.3);
            color: #94a3b8;
            padding: 10px 20px;
            border-radius: 10px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .back-btn:hover {
            color: #fff;
            border-color: #fff;
        }
    </style>
</head>
<body>

    <!-- Contenedor Cinemático interactivo por Scroll -->
    <div class="cinema-container">
        <canvas id="cinematicCanvas"></canvas>
        <div class="scroll-hint" id="scrollHint">↓ Desliza para iniciar la cinemática de ataque ↓</div>

        <!-- Etapa Final: El Botón 101 -->
        <div class="final-stage" id="finalStage">
            <div class="btn-101" onclick="openSubPage()">101</div>
            <div class="btn-subtitle">El núcleo ha emergido • Toca para entrar</div>
        </div>
    </div>

    <!-- Segunda Pestaña con los 3 Botones -->
    <div class="sub-page" id="subPage">
        <h1 class="sub-title">Base de Operaciones 101</h1>
        <p class="sub-text">Has completado la secuencia cinemática con éxito. Selecciona una de las opciones tácticas del sistema:</p>
        
        <div class="action-buttons-group">
            <button class="action-btn" onclick="alert('Función 1: Modo Táctico activado.')">Opción Táctica A</button>
            <button class="action-btn" onclick="alert('Función 2: Telemetría de Titanes en directo.')">Opción Táctica B</button>
            <button class="action-btn" onclick="alert('Función 3: Secuencia de Autodestrucción simulada.')">Opción Táctica C</button>
        </div>

        <button class="back-btn" onclick="closeSubPage()">Reiniciar Cinematográfica</button>
    </div>

    <script>
        const canvas = document.getElementById('cinematicCanvas');
        const ctx = canvas.getContext('2d');
        const scrollHint = document.getElementById('scrollHint');
        const finalStage = document.getElementById('finalStage');
        const subPage = document.getElementById('subPage');

        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();

        let scrollProgress = 0;

        // Controlar el avance y retroceso cinemático mediante el Scroll
        window.addEventListener('scroll', () => {
            const scrollTop = window.scrollY;
            const maxScroll = document.documentElement.scrollHeight - window.innerHeight;
            scrollProgress = Math.max(0, Math.min(1, scrollTop / maxScroll));

            if (scrollTop > 40) {
                scrollHint.style.opacity = '0';
            } else {
                scrollHint.style.opacity = '1';
            }

            if (scrollProgress > 0.92) {
                finalStage.classList.add('active');
            } else {
                finalStage.classList.remove('active');
            }
        });

        // Bucle de renderizado de la Cinemática Vectorial AOT
        function renderCinematic() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            const w = canvas.width;
            const h = canvas.height;

            // 1. Fondo oscuro con atmósfera de murallas y niebla
            const bgGrad = ctx.createLinearGradient(0, 0, 0, h);
            bgGrad.addColorStop(0, '#05070c');
            bgGrad.addColorStop(1, '#0d111a');
            ctx.fillStyle = bgGrad;
            ctx.fillRect(0, 0, w, h);

            // Siluetas de las murallas al fondo
            ctx.fillStyle = '#090d16';
            ctx.fillRect(w * 0.1, h * 0.3, w * 0.2, h * 0.7);
            ctx.fillRect(w * 0.7, h * 0.2, w * 0.25, h * 0.8);

            // 2. Posición del Titán de clase especial (Avanza según el scroll)
            const titanX = w * 0.5;
            const titanBaseY = h * 0.85;
            // El titán crece e impacta a medida que bajamos
            const titanScale = 1 + scrollProgress * 0.5;
            const titanHeight = 300 * titanScale;
            const titanWidth = 180 * titanScale;

            // Dibujar cuerpo del Titán
            ctx.fillStyle = '#1e1b2e';
            ctx.beginPath();
            ctx.ellipse(titanX, titanBaseY - titanHeight * 0.4, titanWidth * 0.5, titanHeight * 0.45, 0, 0, Math.PI * 2);
            ctx.fill();

            // Cabeza grotesca y rara del Titán
            ctx.fillStyle = '#2d2640';
            ctx.beginPath();
            ctx.arc(titanX, titanBaseY - titanHeight + 20, 65 * titanScale, 0, Math.PI * 2);
            ctx.fill();

            // Ojos brillantes amenazantes del Titán
            ctx.fillStyle = scrollProgress > 0.7 ? '#ef4444' : '#f59e0b';
            ctx.shadowColor = ctx.fillStyle;
            ctx.shadowBlur = 15;
            ctx.fillRect(titanX - 25 * titanScale, titanBaseY - titanHeight, 15, 8);
            ctx.fillRect(titanX + 10 * titanScale, titanBaseY - titanHeight, 15, 8);
            ctx.shadowBlur = 0; // Reset sombra

            // 3. Eren con el equipo de saltos (ODM Gear) y ganchos
            // Su posición se calcula con una curva en función del scroll
            const erenX = w * 0.2 + (scrollProgress * w * 0.3);
            const erenY = h * 0.6 - Math.sin(scrollProgress * Math.PI * 3) * 120;

            // Estela de gas y cables del equipo de maniobras
            if (scrollProgress < 0.9) {
                ctx.strokeStyle = 'rgba(255, 255, 255, 0.35)';
                ctx.lineWidth = 2;
                ctx.beginPath();
                ctx.moveTo(titanX, titanBaseY - titanHeight + 20); // Anclado a la nuca
                ctx.lineTo(erenX, erenY);
                ctx.stroke();

                // Dibujar a Eren girando con las espadas
                ctx.save();
                ctx.translate(erenX, erenY);
                ctx.rotate(scrollProgress * Math.PI * 6); // Giro de ataque veloz

                // Silueta de Eren
                ctx.fillStyle = '#ffffff';
                ctx.fillRect(-8, -15, 16, 30);

                // Espadas láser brillantes de acero blanco/celeste
                ctx.strokeStyle = '#38bdf8';
                ctx.lineWidth = 4;
                ctx.shadowColor = '#38bdf8';
                ctx.shadowBlur = 10;
                ctx.beginPath();
                ctx.moveTo(-25, -10); ctx.lineTo(15, -25);
                ctx.moveTo(-25, 10); ctx.lineTo(15, 25);
                ctx.stroke();
                ctx.restore();
            }

            // 4. Explosión final en la nuca cuando Eren llega al objetivo
            if (scrollProgress >= 0.85) {
                const explosionProgress = (scrollProgress - 0.85) / 0.15;
                const radius = explosionProgress * 250;

                ctx.save();
                const grad = ctx.createRadialGradient(titanX, titanBaseY - titanHeight, 10, titanX, titanBaseY - titanHeight, radius);
                grad.addColorStop(0, 'rgba(255, 255, 255, 1)');
                grad.addColorStop(0.4, 'rgba(239, 68, 68, 0.8)');
                grad.addColorStop(1, 'rgba(168, 85, 247, 0)');
                
                ctx.fillStyle = grad;
                ctx.beginPath();
                ctx.arc(titanX, titanBaseY - titanHeight, radius, 0, Math.PI * 2);
                ctx.fill();
                ctx.restore();
            }

            requestAnimationFrame(renderCinematic);
        }
        renderCinematic();

        // Control de la segunda pestaña
        function openSubPage() {
            subPage.classList.add('open');
        }

        function closeSubPage() {
            subPage.classList.remove('open');
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }
    </script>
</body>
</html>
