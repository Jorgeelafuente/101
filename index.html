<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>101 • Matrix Neural Interface</title>
    <link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=Outfit:wght@400;700;900&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            user-select: none;
            -webkit-user-select: none;
        }

        body, html {
            width: 100%;
            height: 100%;
            background-color: #000000;
            color: #00ff66;
            font-family: 'Share Tech Mono', monospace;
            overflow-x: hidden;
        }

        /* Altura de scroll generosa para controlar la cinemática matrix */
        body {
            height: 500vh;
        }

        /* Contenedor fijo de la cinemática */
        .cinema-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: #000300;
            z-index: 10;
            overflow: hidden;
        }

        #matrixCanvas {
            width: 100%;
            height: 100%;
            display: block;
        }

        /* Indicador de desplazamiento inicial */
        .scroll-hint {
            position: absolute;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            color: #00ff66;
            font-size: 0.9rem;
            letter-spacing: 2px;
            text-transform: uppercase;
            z-index: 20;
            pointer-events: none;
            animation: pulseHint 2s infinite ease-in-out;
            text-align: center;
            background: rgba(0, 20, 5, 0.7);
            padding: 10px 20px;
            border-radius: 4px;
            border: 1px solid rgba(0, 255, 102, 0.3);
            box-shadow: 0 0 15px rgba(0, 255, 102, 0.2);
        }

        @keyframes pulseHint {
            0%, 100% { opacity: 0.4; transform: translate(-50%, 0); }
            50% { opacity: 1; transform: translate(-50%, -6px); }
        }

        /* Etapa Final: El Botón 101 */
        .final-stage {
            position: absolute;
            inset: 0;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            background: rgba(0, 5, 2, 0.85);
            backdrop-filter: blur(15px);
            z-index: 30;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.8s ease;
        }

        .final-stage.active {
            opacity: 1;
            pointer-events: auto;
        }

        .btn-101 {
            font-size: 10rem;
            font-weight: 900;
            font-family: 'Outfit', sans-serif;
            background: linear-gradient(135deg, #ffffff 20%, #00ff66 60%, #008f39 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            cursor: pointer;
            filter: drop-shadow(0 0 40px rgba(0, 255, 102, 0.6));
            transition: transform 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275), filter 0.3s ease;
            line-height: 1;
            margin-bottom: 15px;
        }

        .btn-101:hover {
            transform: scale(1.12) rotate(2deg);
            filter: drop-shadow(0 0 65px rgba(0, 255, 102, 0.9));
        }

        .btn-subtitle {
            color: #8affb0;
            font-size: 1rem;
            letter-spacing: 3px;
            text-transform: uppercase;
            font-weight: 700;
        }

        /* Segunda pestaña / Vista interna */
        .sub-page {
            position: fixed;
            inset: 0;
            background: #020503;
            z-index: 100;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 30px;
            text-align: center;
            transform: translateY(100%);
            transition: transform 0.6s cubic-bezier(0.16, 1, 0.3, 1);
            border-top: 2px solid #00ff66;
            box-shadow: 0 -10px 40px rgba(0, 255, 102, 0.2);
        }

        .sub-page.open {
            transform: translateY(0);
        }

        .sub-title {
            font-size: 2.5rem;
            font-weight: 900;
            font-family: 'Outfit', sans-serif;
            margin-bottom: 15px;
            background: linear-gradient(135deg, #00ff66, #ffffff);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .sub-text {
            color: #a3e6c9;
            font-size: 1.1rem;
            max-width: 550px;
            line-height: 1.6;
            margin-bottom: 35px;
        }

        /* Contenedor de los 3 botones finales */
        .action-buttons-group {
            display: flex;
            gap: 15px;
            flex-wrap: wrap;
            justify-content: center;
            margin-bottom: 30px;
            max-width: 600px;
        }

        .action-btn {
            background: rgba(0, 255, 102, 0.05);
            border: 1px solid rgba(0, 255, 102, 0.3);
            color: #00ff66;
            padding: 12px 24px;
            border-radius: 8px;
            font-weight: 700;
            font-family: 'Share Tech Mono', monospace;
            cursor: pointer;
            letter-spacing: 1px;
            text-transform: uppercase;
            transition: all 0.3s ease;
            font-size: 1rem;
        }

        .action-btn:hover {
            background: rgba(0, 255, 102, 0.2);
            border-color: #00ff66;
            box-shadow: 0 0 25px rgba(0, 255, 102, 0.5);
            transform: translateY(-2px);
            color: #ffffff;
        }

        .back-btn {
            background: transparent;
            border: 1px solid rgba(255, 255, 255, 0.2);
            color: #8affb0;
            padding: 10px 20px;
            border-radius: 8px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s ease;
            font-family: 'Share Tech Mono', monospace;
        }

        .back-btn:hover {
            color: #fff;
            border-color: #fff;
            background: rgba(255, 255, 255, 0.05);
        }
    </style>
</head>
<body>

    <!-- Contenedor Cinemático Matrix por Scroll -->
    <div class="cinema-container">
        <canvas id="matrixCanvas"></canvas>
        <div class="scroll-hint" id="scrollHint">>> Desliza para decodificar la matriz <<</div>

        <!-- Etapa Final: El Botón 101 -->
        <div class="final-stage" id="finalStage">
            <div class="btn-101" onclick="openSubPage()">101</div>
            <div class="btn-subtitle">Núcleo decodificado • Pulsa para entrar</div>
        </div>
    </div>

    <!-- Segunda Pestaña con los 3 Botones -->
    <div class="sub-page" id="subPage">
        <h1 class="sub-title">Terminal del Sistema 101</h1>
        <p class="sub-text">Decodificación completada con éxito. Selecciona un protocolo del sistema:</p>
        
        <div class="action-buttons-group">
            <button class="action-btn" onclick="alert('Protocolo Alfa: Conexión cifrada establecida.')">Protocolo Alfa</button>
            <button class="action-btn" onclick="alert('Protocolo Beta: Diagnóstico de nodos activo.')">Protocolo Beta</button>
            <button class="action-btn" onclick="alert('Protocolo Omega: Secuencia de reinicio simulada.')">Protocolo Omega</button>
        </div>

        <button class="back-btn" onclick="closeSubPage()">Reiniciar Secuencia</button>
    </div>

    <script>
        const canvas = document.getElementById('matrixCanvas');
        const ctx = canvas.getContext('2d');
        const scrollHint = document.getElementById('scrollHint');
        const finalStage = document.getElementById('finalStage');
        const subPage = document.getElementById('subPage');

        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();

        let scrollProgress = 0;

        // Alfabeto digital Matrix
        const characters = "0101010101XYZMATRIXSYNAPSECORE$_#><";
        const fontSize = 18;
        const columns = Math.floor(canvas.width / fontSize);
        const drops = [];

        for (let i = 0; i < columns; i++) {
            drops[i] = Math.floor(Math.random() * canvas.height);
        }

        // Control de la cinemática mediante el Scroll
        window.addEventListener('scroll', () => {
            const scrollTop = window.scrollY;
            const maxScroll = document.documentElement.scrollHeight - window.innerHeight;
            scrollProgress = Math.max(0, Math.min(1, scrollTop / maxScroll));

            if (scrollTop > 40) {
                scrollHint.style.opacity = '0';
            } else {
                scrollHint.style.opacity = '1';
            }

            if (scrollProgress > 0.92) {
                finalStage.classList.add('active');
            } else {
                finalStage.classList.remove('active');
            }
        });

        // Bucle de renderizado Matrix Cinemático
        function renderMatrixCinematic() {
            // Fondo semitransparente para efecto de estela
            ctx.fillStyle = 'rgba(0, 5, 2, 0.15)';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            ctx.fillStyle = '#00ff66';
            ctx.font = fontSize + 'px "Share Tech Mono", monospace';

            // Lluvia de código Matrix tradicional que acelera según el scroll
            for (let i = 0; i < drops.length; i++) {
                const text = characters.charAt(Math.floor(Math.random() * characters.length));
                const x = i * fontSize;
                const y = drops[i] * fontSize;

                // Cambiar brillo de algunos caracteres
                ctx.fillStyle = Math.random() > 0.85 ? '#ffffff' : '#00ff66';
                ctx.fillText(text, x, y);

                if (y > canvas.height && Math.random() > 0.975) {
                    drops[i] = 0;
                }
                drops[i] += 1 + (scrollProgress * 5); // Velocidad influenciada por el scroll
            }

            // Elemento cinemático central: Un núcleo de datos que se expande al hacer scroll
            const centerX = canvas.width / 2;
            const centerY = canvas.height / 2;
            const coreRadius = 50 + (scrollProgress * 300);

            ctx.save();
            ctx.strokeStyle = scrollProgress > 0.7 ? '#ffffff' : '#00ff66';
            ctx.lineWidth = 2 + (scrollProgress * 4);
            ctx.shadowColor = '#00ff66';
            ctx.shadowBlur = 20;
            ctx.beginPath();
            ctx.arc(centerX, centerY, coreRadius, 0, Math.PI * 2);
            ctx.stroke();
            ctx.restore();

            // Efecto de explosión de datos al llegar al final del scroll
            if (scrollProgress >= 0.85) {
                const explosionProgress = (scrollProgress - 0.85) / 0.15;
                const flashRadius = explosionProgress * Math.max(canvas.width, canvas.height);

                ctx.save();
                const grad = ctx.createRadialGradient(centerX, centerY, 10, centerX, centerY, flashRadius);
                grad.addColorStop(0, 'rgba(255, 255, 255, 1)');
                grad.addColorStop(0.3, 'rgba(0, 255, 102, 0.8)');
                grad.addColorStop(1, 'rgba(0, 0, 0, 0)');
                
                ctx.fillStyle = grad;
                ctx.beginPath();
                ctx.arc(centerX, centerY, flashRadius, 0, Math.PI * 2);
                ctx.fill();
                ctx.restore();
            }

            requestAnimationFrame(renderMatrixCinematic);
        }
        renderMatrixCinematic();

        // Control de transición de la segunda pestaña
        function openSubPage() {
            subPage.classList.add('open');
        }

        function closeSubPage() {
            subPage.classList.remove('open');
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }
    </script>
</body>
</html>
